[workspace]
members = ["crates/tickstore", "crates/features", "crates/replay", "crates/costmodel", "crates/metrics", "crates/ledger", "crates/api", "crates/riskengine", "crates/engine", "crates/exec"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "UNLICENSED"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
arrow-array = "59.3.2"
arrow-schema = "59.3.2"
parquet = { version = "59.3.2", default-features = false, features = ["arrow", "snap"] }
sha2 = "0.10"
hex = "0.4"
serde_jcs = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
tokio = { version = "1", features = ["full"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
