[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.28"
# Cancun is a subset of what Robinhood Chain (Arbitrum Orbit) supports.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read-write", path = "./deployments" }]
# Fork tests live in test/fork and only run when FORK_RPC_URL is set.
no_match_path = "test/fork/*"

[profile.fork]
no_match_path = "test/none/*"
match_path = "test/fork/*"

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 96
fail_on_revert = false

[fmt]
line_length = 120
