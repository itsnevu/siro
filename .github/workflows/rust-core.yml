name: Rust causal core
on: [push, pull_request]
jobs:
  trading-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@3da603d4464771f1a8c3dd4acb41f03bc8107551 # 1.92.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --locked
      # Supply chain: RustSec advisories for every crate in Cargo.lock.
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Supply chain: registry signatures and known vulnerabilities in production dependencies.
      - run: npm audit signatures
      - run: npm audit --audit-level=high --omit=dev
      - run: node scripts/check-performance.mjs
      - run: npm run test:trading
      - run: npm run build
  trading-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
      - run: forge test --root contracts --no-match-path 'test/fork/*'
